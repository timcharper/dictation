[package]
name = "dictation"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.86"
atspi = { version = "0.29.0", features = ["tokio", "proxies", "connection", "zbus"] }
atspi-common = "0.13.0"
atspi-connection = "0.13.0"
atspi-proxies = "0.13.0"
bytemuck = "1.25.0"
bytes = "1.11.1"
chrono = { version = "0.4.39", features = ["serde"] }
clap = { version = "4.6.0", features = ["derive"] }
cpal = "0.15.3"
directories = "6.0.0"
futures-lite = "2.6.1"
futures-util = "0.3.32"
gio = "0.22.2"
glib = "0.22.3"
gtk4 = "0.11.1"
hound = "3.5.1"
libadwaita = { version = "0.9.1", features = ["v1_2", "v1_4", "v1_6"] }
libpulse-binding = "2.30.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
pulsectl-rs = "0.3.0"
rodio = { version = "0.19.0", features = ["vorbis"] }
earshot = "1.0.0"
rubato = "0.16.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full"] }
tokio-stream = "0.1.18"
tokio-util = { version = "0.7.18", features = ["io"] }
toml = "1.1.0"
zbus = "5.14.0"

